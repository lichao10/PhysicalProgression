name: Build and game tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build, test and prepare release bundle
        run: ./gradlew verifyGameTests releaseBundle --console=plain
      - name: Create release checksums
        run: |
          cd build
          sha256sum libs/*.jar distributions/*.zip > distributions/SHA256SUMS
      - name: Save diagnostics and deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical_progression-validation
          path: |
            build/libs/*.jar
            build/distributions/*.zip
            build/distributions/SHA256SUMS
            build/reports/**
            run/logs/**
